<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
  <body>
    <style>
      html {
        background-color: #00003f;
        line-height: 1;
        color: #ffffff;
        font-family: "monospace", monospace;
      }
    </style>
    TEXT ANAGRAM: <label for="chooanag">Type stuff</label><input type="text" id="chooanag" value="" oninput="anag()"><span id="erroanag">update plz</span><label for="testanag"></label><input type="text" id="testanag" value="" oninput="anag()"><br>
    TEXT PERMUTATION: <label for="chooperm">Type stuff</label><input type="text" id="chooperm" value="" oninput="perm()"><label for="numbperm">Permutation Number</label><input type="text" id="numbperm" value="0" oninput="perm()"><span id="resuperm">update plz</span><br>
    LETTER COMBINATION: <label for="choocole">Type length</label><input type="text" id="choocole" value="" oninput="comb()"><label for="chooconu">Permutation Number</label><input type="text" id="chooconu" value="0" oninput="comb()"><br><span id="resucomb">update plz</span>
    <label for="choocofi">Find</label><input type="text" id="choocofi" value=""><button onclick="cofi()"></button>
    <br>
    <br>You have spent
    <br><span id="seconds">update plz</span>
    <br>seconds on this website.
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
      //alert("Message: " + message + "\n" + "Line: " + lineno + "Col: " + colno)
      return false
    }
      var t = new Date().getTime()
      var cc = "0123456789"
      var ca = [
        "111101101101111",
        "110010010010111",
        "110001010100111",
        "110001010001110",
        "011101111001001",
        "111100110001110",
        "011100110101010",
        "111001010100100",
        "010101010101010",
        "010101011001110"
      ]
      function mod(x, y) {
        return (x-(x/y)*y) + y*BigInt(x*y < 0n)
      }
      function anag() {
        let use = document.getElementById("chooanag").value.split("")
        let set = document.getElementById("testanag").value.split("")
        let extra = []
        for (let i = 0; i < set.length; i++) {
          if (use.includes(set[i])) {
            use.splice(use.indexOf(set[i]), 1)
          } else {
            extra.push(set[i])
          }
        }
        document.getElementById("erroanag").innerHTML = "[USE "+use+" ; REMOVE "+extra+"]"
      }
      function perm() {
        document.getElementById("numbperm").value = document.getElementById("numbperm").value.split("").map(v=>["",v][Number("0123456789".includes(v))]).join("")
        let n = BigInt(document.getElementById("numbperm").value)
        let p = 1n
        let t = document.getElementById("chooperm").value
        let s = t.split("")
        let u = ""
        if (t.length == 0) {
          document.getElementById("resuperm").innerHTML = ""
          return 0
        }
        for (let i = 1; i < t.length; i++) {
          p*=BigInt(i)
        }
        n=n%(BigInt(t.length)*p)
        document.getElementById("numbperm").value = n.toString()
        for (let i = 0; i < t.length-2; i++) {
          u+=s.splice(Number(n/p),1)
          n-=(n/p)*p
          p/=BigInt(t.length-i-1)
        }
        document.getElementById("resuperm").innerHTML = u+["",s,[s[0]+s[1],s[1]+s[0]][Number(n)]][s.length]
      }
      function char(s,x) {
        s=s.toString()
        let p = ".....".split("").map(v => ".".repeat(s.length*4).split("").map(v => "0"))
        for (let i = 0; i < s.length; i++) {
          if (cc.includes(s[i])) {
            for (let j = 0; j < 15; j++) {
              p[Math.floor(j/3)][j%3+i*4] = ca[cc.indexOf(s[i])][j]
            }
          } else {
            for (let j = 0; j < 15; j++) {
              p[Math.floor(j/3)][j%3+i*4] = Math.floor(Math.random()*1.0625+j/16)
            }
          }
        }
        return p.map(v => v.map(v => String.fromCharCode([46,9608][Number(v)])).join("")).join(["<br>","\n"][x])
      }
      function rbi(seed, min, max) {
        let str = [...String(seed)].map(v => BigInt(v.codePointAt()))
        let r = max-min+1n
        let n = 3n
        for (let i = 0n; i < 10n; i++) {
          n=n**2n
          n+=7n*i
          n%=r
        }
        for (let i = 0; i < str.length; i++) {
          n=n**2n
          n+=str[i]
          n%=r
        }
        return n+min
      }
      function comb() {
        if (/^-?\d+$/.test(document.getElementById("choocole").value) && /^-?\d+$/.test(document.getElementById("chooconu").value)) {
          let l = BigInt(document.getElementById("choocole").value)
          let n = BigInt(document.getElementById("chooconu").value)
          let v = 2n
          while (rbi(v, 26n**l/3n, 26n**l - 26n**l/3n)%2n == 0n || rbi(v, 26n**l/3n, 26n**l - 26n**l/3n)%13n == 0n) {
            v++
          }
          v = rbi(v, 26n**l/3n, 26n**l - 26n**l/3n)
          let a = (numer) => {
            let numr = numer
            let digits = ""
            for (let i = 0n; i < l; i++) {
              digits = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"[numr%26n]+digits
              numr/=26n
            }
            return digits
          }
          let t = ""
          for (let i = 0; i < 45; i++) {
            t+=a(mod(v*(BigInt(i)+n-22n), 26n**l))
            t+=(" ".repeat(21)+"[]"+" ".repeat(22))[i]
            if (i%5==4) t+="<br>"
          }
          document.getElementById("resucomb").innerHTML = t
        } else {
          document.getElementById("resucomb").innerHTML = "update plz"
        }
      }
      function cofi() {
        let s = document.getElementById("choocofi").value
        let l = BigInt(s.length)
        document.getElementById("choocole") = l
        let v = 2n
        while (rbi(v, 26n**l/3n, 26n**l - 26n**l/3n)%2n == 0n || rbi(v, 26n**l/3n, 26n**l - 26n**l/3n)%13n == 0n) {
          v++
        }
        v = rbi(v, 26n**l/3n, 26n**l - 26n**l/3n)
        let d = []
        for (let i = 0n; i < l; i++) {
          d.splice(0, 0, v%26n)
          v/=26n
        }
        let e = d.concat(d).map(v => 0n)
        for (let i = l-1n; i >= 0n; i--) {
          while ("ABCDEFGHIJKLMNOPQRSTUVWXYZ"[e[i+l]] != s[i]) {
            for (let j = 0n; j < l; j++) {
              e[j+i+1n]+=d[j]
              e[j+i]+=e[j+i+1n]/26n
              e[j+i+1n]%=26n
            }
          }
        }
      }
      e.splice(0, Number(l))
      let v = 0n
      for (let i = 0n; i < l; i++) {
        v+=e[0]
        v*=26n
        e.splice(0, 1)
      }
      document.getElementById("chooconu").value=v
      anag()
      perm()
      comb()
      setInterval(() => {
        document.getElementById("seconds").innerHTML = char("a"+Math.floor((new Date().getTime()-t)/1000).toString()+"a", 0)
      }, 100)
    </script>
  </body>
</html>
